name: SBOM and License Compliance

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'contracts/**'

jobs:
  sbom-and-license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm install -g @cyclonedx/cyclonedx-npm
          cargo install cargo-cyclonedx

      - name: Generate SBOM (Backend)
        run: |
          cd backend || true
          # Note: If there's no package-lock.json, cyclonedx-npm works better with dependencies installed
          npm install --package-lock-only || true
          npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file ../sbom-backend.json

      - name: Generate SBOM (Frontend)
        run: |
          cd frontend || true
          npm install --package-lock-only || true
          npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file ../sbom-frontend.json

      - name: Generate SBOM (Rust Contracts)
        run: |
          cargo cyclonedx --format json > sbom-contracts.json

      - name: Merge SBOMs
        run: |
          # Only merge files that were successfully created
          FILES=""
          [ -f sbom-backend.json ] && FILES="$FILES sbom-backend.json"
          [ -f sbom-frontend.json ] && FILES="$FILES sbom-frontend.json"
          [ -f sbom-contracts.json ] && FILES="$FILES sbom-contracts.json"
          
          # Use Node.js to merge JSON files (no external package needed)
          if [ -n "$FILES" ]; then
            node -e "
              const fs = require('fs');
              const files = '$FILES'.trim().split(/\s+/);
              const merged = {
                bomFormat: 'CycloneDX',
                specVersion: '1.4',
                version: 1,
                components: []
              };
              files.forEach(file => {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                if (data.components) {
                  merged.components.push(...data.components);
                }
              });
              fs.writeFileSync('sbom-full.json', JSON.stringify(merged, null, 2));
              console.log('Merged ' + files.length + ' SBOM files into sbom-full.json');
            "
          else
            echo "No SBOM files to merge"
            exit 1
          fi

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-full
          path: sbom-full.json

      - name: Enforce License Compliance
        run: node scripts/check-licenses.js
