name: SBOM and License Compliance

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'contracts/**'

jobs:
  sbom-and-license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm install -g @cyclonedx/cyclonedx-npm || { echo "ERROR: Failed to install @cyclonedx/cyclonedx-npm"; exit 1; }
          cargo install cargo-cyclonedx || { echo "ERROR: Failed to install cargo-cyclonedx"; exit 1; }
          echo "✓ Dependencies installed successfully"

      - name: Generate SBOM (Backend)
        run: |
          if [ -d backend ]; then
            cd backend
            npm install --package-lock-only
            npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file ../sbom-backend.json
            echo "✓ Backend SBOM generated"
          else
            echo "⚠ Backend directory not found, skipping"
          fi

      - name: Generate SBOM (Frontend)
        run: |
          if [ -d frontend ]; then
            cd frontend
            npm install --package-lock-only
            npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file ../sbom-frontend.json
            echo "✓ Frontend SBOM generated"
          else
            echo "⚠ Frontend directory not found, skipping"
          fi

      - name: Generate SBOM (Rust Contracts)
        run: |
          echo "Generating Rust SBOM..."
          export NO_COLOR=1
          export TERM=dumb
          # cargo-cyclonedx outputs JSON by default, just redirect to file
          if cargo cyclonedx > sbom-contracts.json 2>&1; then
            if [ -f sbom-contracts.json ] && [ -s sbom-contracts.json ]; then
              echo "✓ Rust SBOM generated successfully"
              echo "File size: $(wc -c < sbom-contracts.json) bytes"
              # Verify it's valid JSON
              if node -e "JSON.parse(require('fs').readFileSync('sbom-contracts.json', 'utf8'))" 2>/dev/null; then
                echo "✓ JSON validation passed"
              else
                echo "ERROR: sbom-contracts.json contains invalid JSON"
                echo "First 200 characters:"
                head -c 200 sbom-contracts.json
                exit 1
              fi
            else
              echo "ERROR: sbom-contracts.json is empty or wasn't created"
              ls -lah sbom-contracts.json 2>&1 || echo "File does not exist"
              exit 1
            fi
          else
            echo "ERROR: cargo cyclonedx command failed"
            echo "Checking cargo-cyclonedx installation..."
            cargo cyclonedx --version || echo "cargo-cyclonedx not properly installed"
            exit 1
          fi

      - name: Merge SBOMs
        run: |
          # Check which files were generated
          FILES=""
          [ -f sbom-backend.json ] && FILES="$FILES sbom-backend.json" && echo "✓ Backend SBOM found" || echo "⚠ Backend SBOM missing"
          [ -f sbom-frontend.json ] && FILES="$FILES sbom-frontend.json" && echo "✓ Frontend SBOM found" || echo "⚠ Frontend SBOM missing"
          [ -f sbom-contracts.json ] && FILES="$FILES sbom-contracts.json" && echo "✓ Rust SBOM found" || echo "⚠ Rust SBOM missing"
          
          # Use Node.js to merge JSON files (no external package needed)
          if [ -n "$FILES" ]; then
            echo "Merging SBOM files:$FILES"
            node -e "
              const fs = require('fs');
              const files = '$FILES'.trim().split(/\s+/);
              const merged = {
                bomFormat: 'CycloneDX',
                specVersion: '1.4',
                version: 1,
                components: []
              };
              files.forEach(file => {
                try {
                  const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                  if (data.components) {
                    merged.components.push(...data.components);
                  }
                } catch (err) {
                  console.error('Error reading ' + file + ':', err.message);
                }
              });
              fs.writeFileSync('sbom-full.json', JSON.stringify(merged, null, 2));
              console.log('✓ Merged ' + files.length + ' SBOM files into sbom-full.json');
              console.log('Total components: ' + merged.components.length);
            "
          else
            echo "ERROR: No SBOM files were generated!"
            echo "At least one SBOM file (Rust contracts) should have been created."
            exit 1
          fi

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-full
          path: sbom-full.json

      - name: Enforce License Compliance
        run: node scripts/check-licenses.js
