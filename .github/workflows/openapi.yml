
name: OpenAPI Validation &amp; SDK Generation

on:
  pull_request:
    paths:
      - 'backend/api/routes/**'
      - 'backend/openapi.yaml'
  push:
    branches:
      - main
    paths:
      - 'backend/api/routes/**'
      - 'backend/openapi.yaml'

jobs:
  validate:
    name: Validate OpenAPI Spec &amp; Routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: cd backend &amp;&amp; npm install

      - name: Validate Express routes vs OpenAPI spec
        run: cd backend &amp;&amp; node scripts/validate-openapi.js

      - name: Install Spectral CLI
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI spec with Spectral
        run: cd backend &amp;&amp; spectral lint openapi.yaml --ruleset .spectral.yml

  generate-sdk:
    name: Generate TypeScript SDK
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install swagger-typescript-api
        run: npm install -g swagger-typescript-api

      - name: Generate TypeScript SDK
        run: |
          swagger-typescript-api -p backend/openapi.yaml -o frontend/lib/api-client -n api.ts --modular

      - name: Check SDK compilation
        run: cd frontend &amp;&amp; npm install &amp;&amp; npx tsc --noEmit

      - name: Commit generated SDK (only on main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/api-client
          git commit -m "feat: auto-generate TypeScript SDK from OpenAPI spec" || echo "No changes to commit"
          git push
