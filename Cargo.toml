[workspace]
members = ["contracts/escrow_contract", "contracts/governance", "contracts/escrow_extensions", "contracts/shared", "contracts/reputation_staking"]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
